# cargo-deny policy: `cargo deny check`, run by the CI `policy` job.

[graph]
# The shell is Linux only; do not audit Windows-only crates' licences twice.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Defaults: RustSec vulnerabilities, unmaintained and unsound crates, yanked
# versions are all errors.
# One "unmaintained" notice (not a vulnerability) remains: ttf-parser, reached
# only through cosmic-text 0.19 -> fontdb 0.23 (fontdb parses face metadata with
# it). The rustybuzz notice went with the cosmic-text 0.19 upgrade (shaping is
# harfrust now). Revisit when fontdb moves to skrifa.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; via fontdb 0.23 (cosmic-text 0.19), no safe upgrade yet" },
]

[licenses]
# Exactly what today's tree needs (`cargo deny list`). A crate offering
# `MIT OR GPL-2.0-only` (self_cell), `MIT OR BSL-1.0` (ryu) or
# `MIT OR Unlicense` (memchr) is satisfied by its permissive side, so those
# alternatives are deliberately not allowed here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    # nucleo-matcher (the launcher's ranking) is MPL-2.0 alone: weak,
    # file-level copyleft, fine for linking and distributing unmodified.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
# The async stacks stay out of the tree, and so does `blocking` (zbus's thread
# pool, gone with zbus). The cargo-tree guard lives in
# crates/alpheus-common/tests/boundaries.rs: see
# `neither_zbus_nor_blocking_is_in_the_daemon` and
# `the_absence_check_bites_on_a_tree_with_zbus`.
deny = [
    { name = "tokio" },
    { name = "async-std" },
    { name = "zbus" },
    { name = "blocking" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
