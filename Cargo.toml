[workspace]
resolver = "3"
members = ["crates/alpheus-commun", "crates/alpheus", "crates/alpheus-demon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
alpheus-commun = { path = "crates/alpheus-commun" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
ratatui = "0.30"
unicode-width = "0.2"
unicode-normalization = "0.1"
cosmic-text = "0.12"
insta = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
