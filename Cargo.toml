[workspace]
resolver = "3"
members = ["crates/alpheus-commun", "crates/alpheus", "crates/alpheus-demon", "crates/alpheus-launch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
alpheus-commun = { path = "crates/alpheus-commun" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
ratatui = "0.30"
unicode-width = "0.2"
unicode-normalization = "0.1"
cosmic-text = "0.12"
# "xkbcommon": keymaps for the launcher's keyboard (layout-aware keys,
# Dvorak), repeat on calloop. Links the system libxkbcommon; the keyboard
# object and its keymap exist only while the launcher is open.
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
insta = "1"
# Fuzzy matching of the launcher (Helix's matcher, fzf scoring). Daemon only.
nucleo-matcher = "0.3"
# Keysym names for the launcher's keys (same version smithay-client-toolkit already compiles).
xkeysym = "0.2"
# System D-Bus (NetworkManager, UPower, BlueZ), blocking API on one thread.
# Decided by Mae on 2026-10-04 (≈ 2.4 MB PSS measured). Daemon only.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
