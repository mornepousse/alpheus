# An invented Mango configuration for the parser's tests: no real setup.
env=TERMINAL,foo-term
gappih=5
source=./keys.conf
source=./extra.conf

bind=SUPER,Return,spawn,$TERMINAL # open term
bind=SUPER,b,spawn,browser
mousebind=SUPER,btn_left,moveresize,curmove
axisbind=SUPER,UP,viewtoleft
gesturebind=none,left,3,focusdir,left
