[package]
name = "alpheus-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "alpheus's resident daemon: the bar"

# The installed binary keeps its name (process name, socket and config paths).
[[bin]]
name = "alpheus-demon"
path = "src/main.rs"

[dependencies]
alpheus-common.workspace = true
cosmic-text.workspace = true
dbus.workspace = true
dbus-crossroads.workspace = true
libc.workspace = true
nucleo-matcher.workspace = true
serde.workspace = true
serde_json.workspace = true
smithay-client-toolkit.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
unicode-width.workspace = true
xkeysym.workspace = true

[dev-dependencies]
alpheus-common = { workspace = true, features = ["testing"] }
insta.workspace = true
# The bridge's library: end-to-end tests drive the daemon exactly as the
# binary would (exchange, run), without building a second binary.
alpheus-launch = { path = "../alpheus-launch" }
