[workspace]
resolver = "3"
members = ["crates/alpheus-common", "crates/alpheus", "crates/alpheus-daemon", "crates/alpheus-launch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
alpheus-common = { path = "crates/alpheus-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
ratatui = "0.30"
unicode-width = "0.2"
unicode-normalization = "0.1"
cosmic-text = "0.12"
# "xkbcommon": keymaps for the launcher's keyboard (layout-aware keys,
# Dvorak), repeat on calloop. Links the system libxkbcommon; the keyboard
# object and its keymap exist only while the launcher is open.
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
insta = "1"
# Fuzzy matching of the launcher (Helix's matcher, fzf scoring). Daemon only.
nucleo-matcher = "0.3"
# Keysym names for the launcher's keys (same version smithay-client-toolkit already compiles).
xkeysym = "0.2"
# System D-Bus (NetworkManager, UPower, BlueZ) through dbus-rs over libdbus, blocking,
# on the D-Bus thread and no thread of its own (tray plan 1, 2026-10-05). Daemon only.
dbus = "0.9"
# The tray's own StatusNotifierWatcher object (tray plan 2, 2026-10-05): dbus-rs's own object
# server, no further dependency. Daemon only, in src/session_bus/watcher.rs.
dbus-crossroads = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Readability lints (open-source plan 5). Warnings here, errors in CI (-D warnings).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
unnested_or_patterns = "warn"
match_same_arms = "warn"
cast_lossless = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
